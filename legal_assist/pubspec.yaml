name: legal_assist
description: "Legal Assist - 法律案件分析主程序，用于案件事实提取和罪名分析"
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 共享数据结构
  legal_engine_shared:
    path: ../shared
  
  # YAML 处理
  yaml: ^3.1.2
  
  # HTTP 客户端（用于 LLM API 调用 - 仅 Phase 2）
  http: ^1.2.0
  
  # 文件选择
  file_picker: ^10.3.8
  
  # 状态管理
  provider: ^6.1.1
  
  # 路径处理
  path: ^1.9.0
  path_provider: ^2.1.1
  shared_preferences: ^2.5.4
  shared_preferences_windows: ^2.4.1
  path_provider_windows: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# 应用图标配置
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "LOGO.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "LOGO.png"

flutter:
  uses-material-design: true
  
  # 内置法律资产
  assets:
    - assets/legal_base.yaml
    - assets/v4-embedding-刑法.pak
