name: embedding_builder_tool
description: "Embedding Builder Tool - 用于维护 YAML 基座和预计算法律 Embedding"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 共享数据结构
  legal_engine_shared:
    path: ../shared
  
  # YAML 处理
  yaml: ^3.1.2
  yaml_writer: ^2.0.0
  
  # HTTP 客户端（用于 LLM API 调用）
  http: ^1.2.0
  
  # 文件选择
  file_picker: ^10.3.8
  
  # 状态管理
  provider: ^6.1.1
  
  # 路径处理
  path: ^1.9.0
  path_provider: ^2.1.1
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
